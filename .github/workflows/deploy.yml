name: Deploy

# The app is a static export (`output: "export"`): `pnpm build` writes plain
# files to `out/`, which go to Cloudflare Pages. No server runs the app.
#
#   push to develop -> GitHub environment "develop"
#   push to main    -> GitHub environment "production"
#   push to demo    -> GitHub environment "demo": the same app with the demo
#                      data layer on (NEXT_PUBLIC_DEMO_CHAINS), no backend
#
# Each GitHub environment holds the values below. Every one is read from the
# environment's Variables first and its Secrets second, so either tab works.
# NEXT_PUBLIC_* end up in the browser bundle anyway; a Variable keeps them
# readable in the logs, a Secret masks them.
#   Values
#     NEXT_PUBLIC_BASE_URL       e.g. https://app.example.com
#     NEXT_PUBLIC_API_BASE_URL   e.g. https://api.example.com/api/v1
#     NEXT_PUBLIC_PRIVY_APP_ID   the Privy app id (25 characters)
#     NEXT_PUBLIC_ASSAY_MCP_VERSION  the exact @goassay-ai/mcp version install commands pin
#     NEXT_PUBLIC_MCP_URL        required: the MCP host, shown in the /connect snippet
#     NEXT_PUBLIC_DEMO_CHAINS    demo only: "robinhood" turns the demo data on
#     NEXT_PUBLIC_SHOW_KITCHEN_SINK  optional: "1" keeps /kitchen-sink
#     CLOUDFLARE_PAGES_PROJECT   the Pages project to deploy to
#   Credentials (keep these as Secrets)
#     CLOUDFLARE_API_TOKEN       a token with "Cloudflare Pages: Edit"
#     CLOUDFLARE_ACCOUNT_ID
#
# Two jobs, so the Cloudflare credentials never share a runner with the app's
# dependencies:
#   build   checks the environment, installs, tests and builds with pnpm, and
#           uploads out/. It has no Cloudflare credential: a compromised
#           package that runs during install or build has nothing to steal.
#   deploy  downloads out/ and deploys it with the wrangler pinned in
#           deploy/wrangler (npm ci from its lockfile, no install scripts). It
#           never checks out or installs the app.
#
# See DEPLOY.md for the one-time setup.

on:
  push:
    branches: [main, develop, demo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Pinned, not ubuntu-latest: the header check drives the runner's preinstalled
  # Chrome, and the ubuntu-latest move to Ubuntu 26 (October 2026) is gradual.
  build:
    if: github.ref_name == 'main' || github.ref_name == 'develop' || github.ref_name == 'demo'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The environment is bound only to read its NEXT_PUBLIC_* values. This job
    # must never reference CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    env:
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID || secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_ASSAY_MCP_VERSION: ${{ vars.NEXT_PUBLIC_ASSAY_MCP_VERSION || secrets.NEXT_PUBLIC_ASSAY_MCP_VERSION }}
      NEXT_PUBLIC_MCP_URL: ${{ vars.NEXT_PUBLIC_MCP_URL || secrets.NEXT_PUBLIC_MCP_URL }}
      NEXT_PUBLIC_DEMO_CHAINS: ${{ vars.NEXT_PUBLIC_DEMO_CHAINS || secrets.NEXT_PUBLIC_DEMO_CHAINS }}
      NEXT_PUBLIC_SHOW_KITCHEN_SINK: ${{ vars.NEXT_PUBLIC_SHOW_KITCHEN_SINK || secrets.NEXT_PUBLIC_SHOW_KITCHEN_SINK }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
      # Which pinned contracts the bundle trusts (src/libs/chains/evm/stake-slashes/deployments.ts).
      # Derived from the branch, not from a Variable, so it cannot drift from the backend it ships with.
      NEXT_PUBLIC_EVM_DEPLOYMENT: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # The Cloudflare credentials are checked in the deploy job, which is the
      # only job that may read them.
      - name: Check the environment is configured
        run: |
          missing=0
          for name in NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_PRIVY_APP_ID NEXT_PUBLIC_ASSAY_MCP_VERSION NEXT_PUBLIC_MCP_URL CLOUDFLARE_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in this environment (neither as a Variable nor as a Secret)"; missing=1; fi
          done
          [ ${#NEXT_PUBLIC_PRIVY_APP_ID} -eq 25 ] || { echo "::error::NEXT_PUBLIC_PRIVY_APP_ID must be 25 characters"; missing=1; }
          # The demo data layer only ever ships from the demo branch.
          if [ "${{ github.ref_name }}" = demo ]; then
            [ "$NEXT_PUBLIC_DEMO_CHAINS" = robinhood ] || { echo "::error::NEXT_PUBLIC_DEMO_CHAINS must be robinhood in the demo environment"; missing=1; }
          elif [ -n "$NEXT_PUBLIC_DEMO_CHAINS" ]; then
            echo "::error::NEXT_PUBLIC_DEMO_CHAINS must not be set outside the demo environment"; missing=1
          fi
          exit $missing

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # Only production may be indexed: demo holds made-up data and develop is a
      # test deployment. The header goes into the existing /* block: Cloudflare
      # Pages keeps only one block per path, so a second /* block would drop the
      # site-wide headers (CSP, HSTS ...).
      - name: Keep demo and develop out of search engines
        if: github.ref_name != 'main'
        run: |
          awk '{ print } $0 == "/*" && !done { print "  X-Robots-Tag: noindex, nofollow"; done = 1 } END { if (!done) exit 1 }' out/_headers > out/_headers.tmp
          mv out/_headers.tmp out/_headers

      # Spec R-WEB-2/3/4: the exact out/ that is deployed must carry integrity
      # on every script and the strict headers, whichever branch was pushed.
      - name: Check the built headers
        run: pnpm check:headers

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: out/
          if-no-files-found: error
          # A re-run of the whole workflow replaces the earlier attempt's copy.
          overwrite: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
      url: ${{ vars.NEXT_PUBLIC_BASE_URL }}
    env:
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Check the Cloudflare credentials are configured
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=0
          [ "$HAS_TOKEN" = true ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ "$HAS_ACCOUNT" = true ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          exit $missing

      # Only deploy/wrangler: the pinned wrangler and its lockfile. The app and
      # its dependencies never reach this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: deploy/wrangler
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # wrangler 4 needs Node 22+.
          node-version: 24

      # npm ci installs exactly the lockfile (integrity-checked) and
      # --ignore-scripts runs no package code at install. wrangler pages deploy
      # needs no install script: workerd and esbuild ship their binaries as
      # platform packages, and a static deploy uses neither.
      - name: Install the pinned wrangler
        working-directory: deploy/wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: out

      # Each environment has its own Pages project, so every deploy is that
      # project's production deployment: deploy under the project's own
      # production branch, whatever it is named, never as a preview.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            | jq -r '.result.production_branch // empty')
          [ -n "$branch" ] || { echo "::error::Could not read the production branch of Pages project $CLOUDFLARE_PAGES_PROJECT"; exit 1; }
          echo "Deploying as production (branch $branch)"
          deploy/wrangler/node_modules/.bin/wrangler pages deploy out \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$branch" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.ref_name }} ${{ github.sha }}"
