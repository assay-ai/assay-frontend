name: Deploy

# The app is a static export (`output: "export"`): `pnpm build` writes plain
# files to `out/`, which go to Cloudflare Pages. No server runs the app.
#
#   push to develop -> GitHub environment "develop"
#   push to main    -> GitHub environment "production"
#
# Each GitHub environment holds:
#   Variables (public: NEXT_PUBLIC_* are inlined into the browser bundle)
#     NEXT_PUBLIC_BASE_URL       e.g. https://app.example.com
#     NEXT_PUBLIC_API_BASE_URL   e.g. https://api.example.com/api/v1
#     NEXT_PUBLIC_PRIVY_APP_ID   the Privy app id (25 characters)
#     NEXT_PUBLIC_MCP_URL        optional, shown in the /connect snippet
#     CLOUDFLARE_PAGES_PROJECT   the Pages project to deploy to
#   Secrets
#     CLOUDFLARE_API_TOKEN       a token with "Cloudflare Pages: Edit"
#     CLOUDFLARE_ACCOUNT_ID
#
# See DEPLOY.md for the one-time setup.

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
      url: ${{ vars.NEXT_PUBLIC_BASE_URL }}
    env:
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
      NEXT_PUBLIC_MCP_URL: ${{ vars.NEXT_PUBLIC_MCP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check the environment is configured
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_PRIVY_APP_ID CLOUDFLARE_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then echo "::error::Variable $name is not set in this environment"; missing=1; fi
          done
          [ "$HAS_TOKEN" = true ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; missing=1; }
          [ "$HAS_ACCOUNT" = true ] || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID is not set"; missing=1; }
          [ ${#NEXT_PUBLIC_PRIVY_APP_ID} -eq 25 ] || { echo "::error::NEXT_PUBLIC_PRIVY_APP_ID must be 25 characters"; missing=1; }
          exit $missing

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4.147.0 pages deploy out
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          --branch "${{ github.ref_name }}"
          --commit-hash "${{ github.sha }}"
          --commit-message "${{ github.ref_name }} ${{ github.sha }}"
